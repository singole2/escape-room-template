<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>神農嘗百草 — 國文閱讀理解密室逃脫</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="site">
    <header class="hero">
      <h1>神農嘗百草 — 密室逃脫</h1>
      <p class="subtitle">從課文出題，蒐集漢字碎片，破解通關密語。</p>
    </header>

    <section class="summary card">
      <h2>課文簡介</h2>
      <p id="text-summary">
        《神農嘗百草》記載古代神農嘗百草、發現藥性的故事，強調觀察與堅持、為民謀福的精神。
      </p>
      <p class="meta">關卡數：5 關（快速）或 10 關（完整）；每關為 1 題選擇題。</p>
      <div class="controls">
        <label>選擇模式：
          <select id="mode-select">
            <option value="5">5 關（快速）</option>
            <option value="10">10 關（完整）</option>
          </select>
        </label>
        <button id="start-btn" class="btn">開始遊戲</button>
      </div>
    </section>

    <section id="game-area" class="card hidden">
      <div id="hud">
        <div id="progress">關卡 <span id="current">0</span>/<span id="total">5</span></div>
        <div id="timer">時間：<span id="time">00:00</span></div>
        <div id="fragments">已收集：<span id="frag-list"></span></div>
      </div>

      <div id="question-card" class="question">
        <h3 id="q-title">題目</h3>
        <p id="q-text"></p>
        <ul id="options" class="options"></ul>
        <div class="hint-area">
          <button id="hint-btn" class="btn small">提示</button>
          <div id="hint-text" class="hint-text hidden"></div>
        </div>
      </div>
    </section>

    <section id="result-area" class="card hidden">
      <h2>已通關！</h2>
      <p id="result-summary"></p>
      <div id="certificate" class="certificate hidden">
        <h3>老師認證</h3>
        <p>恭喜完成《神農嘗百草》閱讀逃脫。</p>
      </div>
      <button id="retry-btn" class="btn">重新挑戰</button>
    </section>

    <img id="character" src="assets/img/character.png" alt="角色" class="floating-char">

    <audio id="bg-music" src="assets/audio/Music_Trap_Drama.mp3" preload="auto"></audio>
    <audio id="award-sfx" src="assets/audio/Awards.m4a" preload="auto"></audio>
  </main>

  <script src="scripts.js"></script>
</body>
</html>
